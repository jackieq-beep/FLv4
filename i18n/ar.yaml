faq:
  kicker: "الأسئلة الشائعة"
  title: "أسئلة وأجوبة."
  items:
    - q: "متى تصدر Football League 2027؟"
      a: "Football League 2027 (FL27) قادمة قريبًا على iPhone و Android. تابع صفحة الأخبار أو Instagram أو Discord، أو اشترك في النشرة البريدية، لتعرف لحظة إطلاقها."
    - q: "ما الجديد في Football League 2027؟"
      a: "تقدّم FL27 مظهرًا وشاشة رئيسية متجددة، وصفحة جديدة لوضع المسيرة، ورسومات مباريات محدّثة تشمل لحظة هدف جديدة، وملعبًا جديدًا كليًا، وتحديات يومية جديدة بمكافآت."
    - q: "هل Football League مجانية؟"
      a: "نعم. يمكن تنزيل Football League ولعبها مجانًا على iPhone و iPad وهواتف وأجهزة Android اللوحية."
    - q: "هل يمكنني لعب Football League بدون إنترنت؟"
      a: "نعم. يمكنك اللعب بدون إنترنت أو Wi-Fi، ثم الاتصال بالإنترنت للمشاركة في الفعاليات المباشرة والتحديات."
    - q: "ما أوضاع اللعب في Football League؟"
      a: "وضع المسيرة، والمباريات الودية بين أي ناديين، وتحديات المهارة اليومية، والفعاليات المباشرة، والدوريات والكؤوس من حول العالم."
    - q: "هل توجد فعاليات مباشرة في Football League؟"
      a: "نعم. تصل فعاليات مباشرة وتحديات جديدة كل أسبوع، مع مكافآت حصرية مثل الأطقم واللاعبين والعملات. راجع صفحة الأخبار لترى الفعاليات الجارية الآن."
    - q: "ما لغات التعليق المتوفرة؟"
      a: "تتوفر في Football League تعليقات المباريات بـ 16 لغة، ويلعبها أكثر من 100 مليون شخص في أكثر من 200 دولة."
    - q: "كيف أحصل على المساعدة بشأن اللعبة أو حسابي أو عملية شراء؟"
      a: "راسل فريق دعم اللاعبين على footballleague2023@gmail.com، أو اسأل المجتمع على Discord."
    - q: "أين يمكنني شراء منتجات Football League الرسمية؟"
      a: "من متجر Football League الرسمي على هذا الموقع: قمصان وهوديز وملابس أطفال وإكسسوارات، تُصنع حسب الطلب وتُشحن إلى جميع أنحاء العالم."

